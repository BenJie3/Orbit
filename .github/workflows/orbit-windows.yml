name: Orbit Windows verification

on:
  push:
    branches:
      - fix/v1.0.0-stability-update-wallpaper
  pull_request:
    branches:
      - main
    paths:
      - 'orbit/**'
      - '.github/workflows/orbit-windows.yml'

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: orbit
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node 20.18.0 (Orbit native module compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm
          cache-dependency-path: orbit/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify native prebuilds on Node 20
        run: node scripts/check-native.cjs
      - name: Test Wallpaper Engine config selection
        run: npm run test:wallpaper
      - name: Test focused, passive and hidden window transitions
        run: npm run test:focus
      - name: Test TXT-to-PDF and media export regressions
        run: npm run test:conversiones
      - name: Prepare SHA-256 verified FFmpeg
        run: npm run setup:video
      - name: Test real playable MP4 video clips
        run: npm run test:video
      - name: Type-check main, preload and renderer
        run: npm run typecheck
      - name: Build Electron application (no installer and no release)
        run: npx electron-vite build
      - name: Generate Sapphire icon
        run: node scripts/generate-icon.cjs
      - name: Verify icon output
        shell: pwsh
        run: |
          if (!(Test-Path 'build/icon.png')) { throw 'Missing build/icon.png' }
